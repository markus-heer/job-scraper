<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projektmanagerin Jobs in München | Indeed.com</title>
  </head>
  <body>
    <header id="jobsearch-Header">
      <a class="gnav-logo" href="/">Indeed</a>
      <nav aria-label="Hauptnavigation">
        <a href="/">Finden Sie Jobs</a>
        <a href="/account/login">Anmelden</a>
      </nav>
    </header>
    <main id="jobsearch-Main">
      <div data-testid="login-wall" class="css-1tgdtxd eu4oa1w0" role="dialog" aria-modal="true">
        <h1>Melden Sie sich an, um alle Stellenangebote zu sehen</h1>
        <p>
          Für die vollständige Ergebnisliste benötigen Sie ein Konto. Erstellen Sie eines oder melden
          Sie sich mit Ihren Zugangsdaten an.
        </p>
        <form action="/account/login" method="post">
          <label for="login-email">E-Mail-Adresse</label>
          <input id="login-email" name="email" type="email" autocomplete="email" />
          <button type="submit">Weiter</button>
        </form>
        <a href="/account/register">Neues Konto erstellen</a>
      </div>
      <div class="jobsearch-JobCountAndSortPane">
        <div class="jobsearch-JobCountAndSortPane-jobCount">
          <span>142 Stellenangebote</span>
        </div>
      </div>
      <nav role="navigation" aria-label="Seitennavigation">
        <a
          data-testid="pagination-page-next"
          aria-label="Nächste Seite"
          href="/jobs?q=Projektmanagerin&amp;l=M%C3%BCnchen&amp;start=10"
          >&gt;</a
        >
      </nav>
    </main>
    <footer id="footer">
      <a href="/legal">Nutzungsbedingungen</a>
    </footer>
  </body>
</html>
